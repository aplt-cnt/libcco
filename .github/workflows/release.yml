name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build.release

      - name: Test
        run: make tests

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance (SLSA L1)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: build/release/liblibcco.a

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/liblibcco.a
            sbom.spdx.json
